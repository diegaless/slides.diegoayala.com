<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Diapositivas de cursos SEF de Diego Ayala."
    >
    <title>Cursos SEF | Diego Ayala</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <script>
      const savedTheme = localStorage.getItem("theme");
      document.documentElement.dataset.theme = savedTheme || "dark";
    </script>
    <script src="../script.js" defer></script>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body class="sef-page">
    <header class="site-header">
      <a class="site-name" href="../" aria-label="Volver a DAM y DAW">Diego Ayala</a>
      <nav class="section-nav" aria-label="Secciones de diapositivas">
        <a href="../">DAM / DAW</a>
        <a href="./" aria-current="page">SEF</a>
      </nav>
      <button
        class="theme-toggle"
        type="button"
        data-theme-toggle
        aria-label="Activar modo claro"
        aria-pressed="true"
        title="Cambiar tema"
      >
        <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M20.4 15.8A8.5 8.5 0 0 1 8.2 3.6 8.5 8.5 0 1 0 20.4 15.8z"></path>
        </svg>
        <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="M4.93 4.93 6.34 6.34"></path>
          <path d="M17.66 17.66 19.07 19.07"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="M6.34 17.66 4.93 19.07"></path>
          <path d="M19.07 4.93 17.66 6.34"></path>
        </svg>
      </button>
    </header>

    <main class="page-main" aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">Certificados SEF</h1>

      <section class="certificates" aria-label="Certificados SEF y módulos">
        <details class="certificate">
          <summary>
            <span>Certificado SEF 1</span>
          </summary>
          <ul class="module-list">
            <li>
              <a href="#" data-pending>Módulo 1</a>
            </li>
            <li>
              <a href="#" data-pending>Módulo 2</a>
            </li>
            <li>
              <a href="#" data-pending>Módulo 3</a>
            </li>
          </ul>
        </details>

        <details class="certificate">
          <summary>
            <span>Certificado SEF 2</span>
          </summary>
          <ul class="module-list">
            <li>
              <a href="#" data-pending>Módulo 1</a>
            </li>
            <li>
              <a href="#" data-pending>Módulo 2</a>
            </li>
            <li>
              <a href="#" data-pending>Módulo 3</a>
            </li>
          </ul>
        </details>

        <details class="certificate">
          <summary>
            <span>Certificado SEF 3</span>
          </summary>
          <ul class="module-list">
            <li>
              <a href="#" data-pending>Módulo 1</a>
            </li>
            <li>
              <a href="#" data-pending>Módulo 2</a>
            </li>
            <li>
              <a href="#" data-pending>Módulo 3</a>
            </li>
          </ul>
        </details>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://github.com/diegaless" target="_blank" rel="noreferrer">GitHub</a>
      <span aria-hidden="true"></span>
      <a href="https://www.linkedin.com/in/diego-ayala/" target="_blank" rel="noreferrer">LinkedIn</a>
      <span aria-hidden="true"></span>
      <a href="mailto:diego.ayala.bernal2@gmail.com">Contacto</a>
    </footer>

    <div class="toast" role="status" aria-live="polite" data-toast></div>
  </body>
</html>
